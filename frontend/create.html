<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Challenge • Best Friend Quiz</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body id="create-page">

  <nav class="navbar">
    <a href="index.html" class="logo"><span>🤝</span> BestFriend Quiz</a>
    <div class="nav-controls">
      <button id="sound-toggle" class="btn-icon">🔊</button>
      <button id="theme-toggle" class="btn-icon">🌙</button>
    </div>
  </nav>

  <div class="container" style="max-width:800px;">
    <div class="glass-card fade-in">
      <h1 style="font-size:2rem; font-weight:800; text-align:center; margin-bottom:1.5rem;">
        🎨 Create Your Best Friend Challenge
      </h1>

      <!-- Creator Details -->
      <div class="form-group">
        <label class="form-label">Your Name</label>
        <input type="text" id="creator-name-input" class="form-control" placeholder="Enter your name (e.g. Alex)" />
      </div>

      <div class="form-group">
        <label class="form-label">Pick Your Avatar</label>
        <div class="avatar-grid" id="avatar-picker">
          <div class="avatar-item active" data-avatar="😊">😊</div>
          <div class="avatar-item" data-avatar="😎">😎</div>
          <div class="avatar-item" data-avatar="🚀">🚀</div>
          <div class="avatar-item" data-avatar="🦄">🦄</div>
          <div class="avatar-item" data-avatar="👑">👑</div>
          <div class="avatar-item" data-avatar="🔥">🔥</div>
          <div class="avatar-item" data-avatar="👾">👾</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Challenge Title</label>
        <input type="text" id="challenge-title-input" class="form-control" value="How well do you know me?" />
      </div>

      <!-- Question Selection Section -->
      <div style="margin:2rem 0; border-top:1px solid var(--card-border); padding-top:1.5rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h2 style="font-size:1.3rem; font-weight:700;">Question Selection</h2>
          <span id="selected-q-count" style="font-weight:800; color:var(--primary-color);">0 Questions Selected</span>
        </div>

        <!-- Search & Filter Bar -->
        <div style="display:grid; grid-template-columns:2fr 1fr; gap:1rem; margin-bottom:1rem;">
          <input type="text" id="q-search-input" class="form-control" placeholder="Search 50+ question bank..." />
          <select id="q-category-filter" class="form-control">
            <option value="ALL">All Categories</option>
            <option value="Food">Food & Drink</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Personal">Personal</option>
            <option value="Fun">Fun & Quirky</option>
          </select>
        </div>

        <!-- Question Library Scroll Container -->
        <div id="question-library-list" style="max-height:280px; overflow-y:auto; padding-right:0.5rem; margin-bottom:1.5rem;">
          <div style="text-align:center; padding:2rem;">Loading 50+ question library...</div>
        </div>

        <!-- Custom Question Creator Accordion -->
        <details class="glass-card" style="padding:1.2rem; background:rgba(102,126,234,0.08); margin-bottom:1.5rem;">
          <summary style="font-weight:700; cursor:pointer; color:var(--primary-color);">
            ➕ Create Custom Question
          </summary>
          <div style="margin-top:1rem; display:flex; flex-direction:column; gap:1rem;">
            <input type="text" id="custom-q-text" class="form-control" placeholder="Enter custom question (e.g. What is my secret fear?)" />
            <select id="custom-q-type" class="form-control">
              <option value="mcq">Multiple Choice</option>
              <option value="tf">True / False</option>
              <option value="text">Text Answer</option>
              <option value="emoji">Emoji Choice</option>
              <option value="rating">Rating (1-10)</option>
            </select>
            <div id="mcq-options-container" style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
              <input type="text" id="opt1" class="form-control" placeholder="Option 1" />
              <input type="text" id="opt2" class="form-control" placeholder="Option 2" />
              <input type="text" id="opt3" class="form-control" placeholder="Option 3" />
              <input type="text" id="opt4" class="form-control" placeholder="Option 4" />
            </div>
            <button id="add-custom-q-btn" type="button" class="btn btn-outline" style="align-self:flex-start;">
              Add Custom Question
            </button>
          </div>
          <div id="custom-q-list" style="margin-top:1rem;"></div>
        </details>
      </div>

      <button id="submit-create-btn" class="btn btn-primary" style="width:100%; font-size:1.1rem; padding:1.1rem;">
        ✨ Start Room & Invite Friend
      </button>

    </div>
  </div>

  <script type="module" src="js/room.js"></script>
</body>
</html>
