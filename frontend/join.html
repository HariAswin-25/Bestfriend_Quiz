<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Challenge • Best Friend Quiz</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body id="join-page">

  <nav class="navbar">
    <a href="index.html" class="logo"><span>🤝</span> BestFriend Quiz</a>
    <div class="nav-controls">
      <button id="sound-toggle" class="btn-icon">🔊</button>
      <button id="theme-toggle" class="btn-icon">🌙</button>
    </div>
  </nav>

  <div class="container" style="max-width:550px;">
    <div class="glass-card fade-in" style="padding:2.5rem 2rem;">
      <h1 style="font-size:2rem; font-weight:800; text-align:center; margin-bottom:1.5rem;">
        🔑 Join Challenge Room
      </h1>

      <div class="form-group">
        <label class="form-label">Room Code</label>
        <input type="text" id="join-code-input" class="form-control" placeholder="Enter 6-character Code (e.g. ABX73D)" style="text-transform:uppercase; letter-spacing:2px; font-weight:700; text-align:center; font-size:1.2rem;" />
      </div>

      <div class="form-group">
        <label class="form-label">Your Name</label>
        <input type="text" id="join-name-input" class="form-control" placeholder="Enter your name (e.g. Sam)" />
      </div>

      <div class="form-group">
        <label class="form-label">Choose Your Avatar</label>
        <div class="avatar-grid" id="avatar-picker">
          <div class="avatar-item active" data-avatar="😎">😎</div>
          <div class="avatar-item" data-avatar="🥳">🥳</div>
          <div class="avatar-item" data-avatar="🐱">🐱</div>
          <div class="avatar-item" data-avatar="⚡">⚡</div>
          <div class="avatar-item" data-avatar="💎">💎</div>
        </div>
      </div>

      <button id="submit-join-btn" class="btn btn-primary" style="width:100%; font-size:1.1rem; padding:1.1rem; margin-top:1rem;">
        🚀 Join Challenge Room
      </button>
    </div>
  </div>

  <script type="module" src="js/room.js"></script>
</body>
</html>
